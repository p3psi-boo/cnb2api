# CNB pipeline for the Magpie-only cnb2api.
#
# Two event blocks:
#  1. `main` crontab — keepalive (every 5 min). Uses a fresh short-lived
#     CNB_TOKEN. No long-lived platform token is stored.
#  2. `$: vscode` — the workspace that runs the HTTP proxy and MQTT heartbeat.
#
# Magpie and every instance must share the same three values (the fleet
# contract). Type the same strings into `magpie plugin login cnb2api`:
#   MQTT_BROKER         how to connect, prefer wss:// on 443
#   MQTT_TOPIC          one topic for the whole fleet
#   MQTT_PSK            AES-256-GCM key for the heartbeat payload
# Plus, only on the workspace:
#   PROXY_KEY           HTTP Bearer the plugin learns from the heartbeat
#   MQTT_INSTANCE_ID    unique name inside the fleet (ws-home, ws-2, …)
#
# CNB_VSCODE_PROXY_URI is injected by the platform; the process publishes it.
# Do not set REGISTER_URL / REG_TOKEN — there is no nginx relay.
#
# Fastest path: fork this repo **private** and inline the secrets below.
# Cleaner path: put them in a private secrets repo and `imports:` it.
# `env:` overrides `imports:`, so delete the inline block when you switch.
# The crontab key is `main:` — rename it if your default branch is not main.
#
# Cron dormancy: CNB may pause crons if the repo has no commits for days.
# Push occasionally so the workspace keeps getting restarted.

main:
  "crontab: */5 * * * *":
    - name: keepalive
      docker:
        image: cnbcool/default-dev-env:latest
      env:
        REPO: $CNB_REPO_SLUG
      stages:
        - name: ensure-workspace
          script: |
            set -uo pipefail
            API="https://api.cnb.cool"
            CODE=$(curl -s --max-time 20 -o /tmp/l.json -w '%{http_code}' "$API/workspace/list?slug=$REPO" -H "Authorization: Bearer $CNB_TOKEN")
            echo "list http=$CODE"
            if [ "$CODE" != "200" ]; then echo "DEGRADED: list http $CODE"; exit 0; fi
            RUNNING=$(jq -r '[(.list // .data // [])[]? | select(.status=="running")][0].sn // empty' /tmp/l.json 2>/dev/null || true)
            if [ -z "$RUNNING" ]; then
              echo "no running workspace -> start"
              curl -s --max-time 60 -X POST "$API/$REPO/-/workspace/start" -H "Authorization: Bearer $CNB_TOKEN" -H "Content-Type: application/json" -d '{"branch":"main"}' | head -c 200; echo
              exit 0
            fi
            echo "running sn=$RUNNING"

$:
  vscode:
    - docker:
        image: cnbcool/default-dev-env:latest
      # Private fork: generate secrets with `openssl rand -hex 24`.
      # Do not ship the placeholders. To use a secrets repo, DELETE this
      # whole env: block and uncomment imports: below.
      env:
        PROXY_KEY: "sk-set-your-own-long-random-key"
        MQTT_BROKER: "wss://broker.example.com/mqtt"
        MQTT_TOPIC: "cnb2api/my-fleet/presence"
        MQTT_PSK: "set-a-long-random-fleet-key"
        MQTT_INSTANCE_ID: "ws-1"
        # MQTT_USER: ""
        # MQTT_PASS: ""
      # imports:
      #   - https://cnb.cool/YOUR_ORG/your-secrets-repo/-/blob/main/proxy.yml
      runner:
        cpus: 2
      services:
        - name: vscode
          options:
            keepAliveTimeout: 18h
        - docker
      stages:
        - name: start-ai-proxy
          script: |
            set -euo pipefail
            bash "$(pwd)/deploy/start.sh"
